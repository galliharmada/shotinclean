<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Cloud — API settings</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: #1c1c1e; background: #f4f4f6; }
      nav { display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e5e5ea; }
      nav b { font-size: 17px; }
      nav a { color: #6e6e73; text-decoration: none; }
      nav a.active { color: #0a84ff; font-weight: 600; }
      main { max-width: 760px; margin: 40px auto; padding: 0 24px; }
      .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 14px; padding: 28px; margin-bottom: 20px; }
      h1 { font-size: 24px; margin: 0 0 6px; }
      p.muted { color: #6e6e73; margin: 0 0 22px; }
      label { display: block; font-weight: 600; margin: 16px 0 6px; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 8px; font: inherit; }
      .key { display: flex; gap: 8px; align-items: center; font-family: ui-monospace, monospace; background: #f2f2f7; padding: 10px 12px; border-radius: 8px; }
      .row { display: flex; gap: 10px; margin-top: 22px; }
      button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 9px; border: 1px solid #d1d1d6; background: #fff; cursor: pointer; }
      button.primary { background: #0a84ff; border-color: #0a84ff; color: #fff; }
      #toast { display: none; margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: #e8f8ee; color: #1a7f37; }
      #cookie { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px 18px; border-radius: 12px; background: #1c1c1e; color: #fff; }
    </style>
  </head>
  <body>
    <nav><b>Acme Cloud</b><a href="#">Projects</a><a href="#">Usage</a><a class="active" href="#">API</a></nav>
    <main>
      <section class="card" id="api-card">
        <h1>API settings</h1>
        <p class="muted">Manage the key your services use to call Acme Cloud.</p>
        <label>Secret key</label>
        <div class="key" id="secret-key">acme_demo_7Hq2eK8vN3mP7rT9wY4zA6bC</div>
        <label for="webhook">Webhook URL</label>
        <input id="webhook" placeholder="https://example.com/hooks/acme" />
        <div class="row">
          <button class="primary" id="save" onclick="document.getElementById('toast').style.display='block'">Save changes</button>
          <button id="rotate">Rotate key</button>
        </div>
        <div id="toast">Settings saved.</div>
      </section>
    </main>
    <div id="cookie">We use cookies to improve your experience.</div>
  </body>
</html>
