<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShotInClean - screenshots and screen recordings, in your browser</title>
    <meta
      name="description"
      content="Capture an area, annotate it, add a background, record the screen or pull text with OCR. A browser-native screenshot studio that never uploads your pixels."
    />
    <meta name="theme-color" content="#f4f1e7" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Gallih Armada" />
    <link rel="preload" as="image" href="/src/landing/assets/editor.webp" fetchpriority="high" />
    <meta name="robots" content="index,follow" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2310110e'/><path d='M9 12.5V9h3.5M19.5 9H23v3.5M23 19.5V23h-3.5M12.5 23H9v-3.5' stroke='%23f4f1e7' stroke-width='2.3' fill='none' stroke-linecap='round'/><circle cx='16' cy='16' r='2.2' fill='%231f3be8'/></svg>"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="ShotInClean" />
    <meta property="og:title" content="ShotInClean - capture it. Keep it clean." />
    <meta
      property="og:description"
      content="Screenshots, annotations, backgrounds, recordings and OCR in one browser tab. Captures never leave your device."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ShotInClean landing page with the annotation editor and a cobalt headline" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShotInClean - capture it. Keep it clean." />
    <meta
      name="twitter:description"
      content="A browser-native screenshot and screen recording studio. Local by default."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="ShotInClean landing page with the annotation editor and a cobalt headline" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ShotInClean",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser",
        "description": "A browser-native screenshot and screen recording studio with annotation, backgrounds, OCR and local history.",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/license/isc-license-txt",
        "codeRepository": "https://github.com/galliharmada/shotinclean",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <style>
      .boot-error {
        max-width: 560px;
        margin: 18vh auto;
        padding: 0 24px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #10110e;
      }
      .boot-error h1 { font-size: 40px; letter-spacing: -0.05em; line-height: 1; }
      .boot-error p { color: #5d5b50; line-height: 1.6; }
      .boot-error button {
        margin-top: 12px; padding: 10px 16px; border: 1px solid #10110e; border-radius: 999px;
        background: #10110e; color: #f4f1e7; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 560px; margin: 18vh auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #10110e">
        <h1 style="font-size: 40px; letter-spacing: -0.05em">ShotInClean needs JavaScript.</h1>
        <p style="color: #5d5b50; line-height: 1.6">
          The capture studio runs entirely in your browser, so JavaScript is required. No capture data is uploaded.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
